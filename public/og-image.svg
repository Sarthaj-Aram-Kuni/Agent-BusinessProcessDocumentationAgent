<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- Background -->
  <rect width="1200" height="630" fill="#0a0a0f"/>

  <!-- Subtle grid pattern -->
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1a1a2e" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- Teal accent bar left -->
  <rect x="0" y="0" width="6" height="630" fill="#0d9488"/>

  <!-- Flowchart icon — right side decorative -->
  <!-- Start node -->
  <rect x="820" y="160" width="140" height="48" rx="24" fill="none" stroke="#0d9488" stroke-width="2" opacity="0.6"/>
  <text x="890" y="190" font-family="monospace" font-size="14" fill="#0d9488" text-anchor="middle" opacity="0.8">Start</text>

  <!-- Arrow down -->
  <line x1="890" y1="208" x2="890" y2="256" stroke="#374151" stroke-width="2"/>
  <polygon points="890,264 884,252 896,252" fill="#374151"/>

  <!-- Process box 1 -->
  <rect x="800" y="264" width="180" height="52" rx="6" fill="#111827" stroke="#0d9488" stroke-width="2" opacity="0.8"/>
  <text x="890" y="295" font-family="monospace" font-size="13" fill="#e5e7eb" text-anchor="middle">Analyse Process</text>

  <!-- Arrow down -->
  <line x1="890" y1="316" x2="890" y2="364" stroke="#374151" stroke-width="2"/>
  <polygon points="890,372 884,360 896,360" fill="#374151"/>

  <!-- Decision diamond -->
  <polygon points="890,372 950,412 890,452 830,412" fill="#1e1b4b" stroke="#7c3aed" stroke-width="2" opacity="0.9"/>
  <text x="890" y="417" font-family="monospace" font-size="11" fill="#c4b5fd" text-anchor="middle">Bottleneck?</text>

  <!-- Arrow yes -->
  <line x1="950" y1="412" x2="1020" y2="412" stroke="#ef4444" stroke-width="2" opacity="0.7"/>
  <polygon points="1028,412 1016,406 1016,418" fill="#ef4444" opacity="0.7"/>
  <rect x="1028" y="388" width="120" height="48" rx="6" fill="#7f1d1d" stroke="#ef4444" stroke-width="2" opacity="0.8"/>
  <text x="1088" y="417" font-family="monospace" font-size="11" fill="#fca5a5" text-anchor="middle">Flag Risk</text>

  <!-- Arrow no -->
  <line x1="890" y1="452" x2="890" y2="500" stroke="#374151" stroke-width="2"/>
  <polygon points="890,508 884,496 896,496" fill="#374151"/>

  <!-- End node -->
  <rect x="820" y="508" width="140" height="48" rx="24" fill="none" stroke="#0d9488" stroke-width="2" opacity="0.6"/>
  <text x="890" y="538" font-family="monospace" font-size="14" fill="#0d9488" text-anchor="middle" opacity="0.8">Report</text>

  <!-- Main title -->
  <text x="100" y="240" font-family="system-ui, -apple-system, sans-serif" font-size="64" font-weight="700" fill="#ffffff" letter-spacing="-1">Process</text>
  <text x="100" y="318" font-family="system-ui, -apple-system, sans-serif" font-size="64" font-weight="700" fill="#ffffff" letter-spacing="-1">Documentation</text>
  <text x="100" y="396" font-family="system-ui, -apple-system, sans-serif" font-size="64" font-weight="700" fill="#ffffff" letter-spacing="-1">Agent</text>

  <!-- Subtitle -->
  <text x="100" y="454" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="400" fill="#0d9488" letter-spacing="0.5">AI-powered BPMN analysis</text>

  <!-- Divider -->
  <line x1="100" y1="490" x2="660" y2="490" stroke="#1f2937" stroke-width="1"/>

  <!-- Tags row -->
  <rect x="100" y="508" width="130" height="32" rx="16" fill="#0d9488" opacity="0.15"/>
  <text x="165" y="529" font-family="system-ui, sans-serif" font-size="13" fill="#0d9488" text-anchor="middle">Flowcharts</text>

  <rect x="244" y="508" width="150" height="32" rx="16" fill="#7c3aed" opacity="0.15"/>
  <text x="319" y="529" font-family="system-ui, sans-serif" font-size="13" fill="#a78bfa" text-anchor="middle">Bottleneck AI</text>

  <rect x="408" y="508" width="130" height="32" rx="16" fill="#0d9488" opacity="0.15"/>
  <text x="473" y="529" font-family="system-ui, sans-serif" font-size="13" fill="#0d9488" text-anchor="middle">Lean + BPMN</text>

  <rect x="552" y="508" width="110" height="32" rx="16" fill="#374151" opacity="0.5"/>
  <text x="607" y="529" font-family="system-ui, sans-serif" font-size="13" fill="#9ca3af" text-anchor="middle">Claude AI</text>
</svg>
